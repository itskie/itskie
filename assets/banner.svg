<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0b111e" />
      <stop offset="100%" stop-color="#06090f" />
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="accentBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="cyanGlow" cx="15%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="85%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#142033" stroke-width="0.8" opacity="0.6"/>
    </pattern>

    <clipPath id="roundedFrame">
      <rect width="920" height="220" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .pulse { animation: pulseAnim 2.2s infinite ease-in-out; }
    @keyframes pulseAnim {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>

  <g clip-path="url(#roundedFrame)">
    <!-- Base Canvas -->
    <rect width="920" height="220" fill="url(#bgGrad)" />
    
    <!-- Cyber Grid Overlay -->
    <rect width="920" height="220" fill="url(#grid)" />

    <!-- Ambient Glows -->
    <rect width="920" height="220" fill="url(#cyanGlow)" />
    <rect width="920" height="220" fill="url(#purpleGlow)" />

    <!-- Top Window Titlebar -->
    <rect width="920" height="34" fill="#0d1424" />
    <line x1="0" y1="34" x2="920" y2="34" stroke="#1e2c47" stroke-width="1" />

    <!-- Mac Traffic Light Dots -->
    <circle cx="24" cy="17" r="5" fill="#ff5f56" />
    <circle cx="42" cy="17" r="5" fill="#ffbd2e" />
    <circle cx="60" cy="17" r="5" fill="#27c93f" />

    <!-- Terminal Prompt Title -->
    <text x="460" y="21" class="mono" font-size="11" fill="#64748b" text-anchor="middle" letter-spacing="0.5">itskie@friday-os: ~/cloud-ai-architect</text>

    <!-- Status Beacon on Top Right -->
    <circle cx="836" cy="17" r="3.5" fill="#22c55e" class="pulse" />
    <text x="846" y="21" class="mono" font-size="10.5" fill="#22c55e" font-weight="600" letter-spacing="0.8">ONLINE</text>

    <!-- Main Hero Content -->
    <!-- Category Monospace Tracker -->
    <text x="50" y="68" class="mono" font-size="11" fill="#38bdf8" font-weight="600" letter-spacing="2.5">❯ SYSTEM ARCHITECTURE &amp; AUTONOMOUS AI</text>

    <!-- Name Header -->
    <text x="48" y="108" class="sans" font-size="34" fill="url(#nameGrad)" font-weight="800" letter-spacing="1.2">SHOBHIT KUMAR SINGH</text>

    <!-- Subtitle Role -->
    <text x="50" y="136" class="sans" font-size="15.5" fill="#94a3b8" font-weight="400">
      AI Systems &amp; Cloud Infrastructure Architect <tspan fill="#475569">|</tspan> Creator of <tspan fill="#38bdf8" font-weight="600">Friday (44★ OSS)</tspan> &amp; <tspan fill="#38bdf8" font-weight="600">ReelDM</tspan>
    </text>

    <!-- Technology Tags Row -->
    <g transform="translate(50, 156)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="135" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="67.5" y="17" class="mono" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="500">FastAPI · AsyncIO</text>

      <!-- Tag 2 -->
      <rect x="145" y="0" width="180" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="235" y="17" class="mono" font-size="11" fill="#a78bfa" text-anchor="middle" font-weight="500">Model Context Protocol</text>

      <!-- Tag 3 -->
      <rect x="335" y="0" width="165" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="417.5" y="17" class="mono" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="500">AWS · Terraform IaC</text>

      <!-- Tag 4 -->
      <rect x="510" y="0" width="165" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="592.5" y="17" class="mono" font-size="11" fill="#2dd4bf" text-anchor="middle" font-weight="500">Neo4j Graph DB &amp; Cypher</text>

      <!-- Tag 5 -->
      <rect x="685" y="0" width="135" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="752.5" y="17" class="mono" font-size="11" fill="#34d399" text-anchor="middle" font-weight="600">LangGraph Agents</text>
    </g>

    <!-- Outer Frame and Bottom Glow Accent -->
    <rect width="920" height="220" rx="12" ry="12" fill="none" stroke="#1e2c47" stroke-width="1.5" />
    <line x1="12" y1="219" x2="908" y2="219" stroke="url(#accentBorder)" stroke-width="2" />
  </g>
</svg>
