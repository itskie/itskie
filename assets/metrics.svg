<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#090e1a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="glowStar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="glowContrib" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="glowToken" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="glowCost" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .val { font-size: 24px; font-weight: 800; }
    .lbl { font-size: 11.5px; font-weight: 600; fill: #e2e8f0; }
    .sub { font-size: 9.5px; fill: #64748b; font-weight: 500; }
  </style>

  <!-- Container Grid: 4 Cards -->
  <g>
    <!-- Card 1: Friday Stars -->
    <rect x="0" y="0" width="222" height="100" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
    <line x1="12" y1="99" x2="210" y2="99" stroke="#f59e0b" stroke-width="2" opacity="0.8" />
    <text x="20" y="38" class="sans val" fill="url(#glowStar)">44+ ⭐</text>
    <text x="20" y="62" class="mono lbl">Friday OSS Stars</text>
    <text x="20" y="80" class="mono sub">Global Community Adoption</text>

    <!-- Card 2: Contributions -->
    <rect x="232" y="0" width="222" height="100" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
    <line x1="244" y1="99" x2="442" y2="99" stroke="#10b981" stroke-width="2" opacity="0.8" />
    <text x="252" y="38" class="sans val" fill="url(#glowContrib)">1,190+ 🔥</text>
    <text x="252" y="62" class="mono lbl">GitHub Contributions</text>
    <text x="252" y="80" class="mono sub">11-Day Active Streak</text>

    <!-- Card 3: Token Optimization -->
    <rect x="464" y="0" width="222" height="100" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
    <line x1="476" y1="99" x2="674" y2="99" stroke="#6366f1" stroke-width="2" opacity="0.8" />
    <text x="484" y="38" class="sans val" fill="url(#glowToken)">91% ⚡</text>
    <text x="484" y="62" class="mono lbl">Token Context Reduction</text>
    <text x="484" y="80" class="mono sub">DeepEval Benchmarked</text>

    <!-- Card 4: AWS FinOps Cost -->
    <rect x="696" y="0" width="224" height="100" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
    <line x1="708" y1="99" x2="908" y2="99" stroke="#f43f5e" stroke-width="2" opacity="0.8" />
    <text x="716" y="38" class="sans val" fill="url(#glowCost)">$2.70/mo ☁️</text>
    <text x="716" y="62" class="mono lbl">ECS Fargate Spot</text>
    <text x="716" y="80" class="mono sub">70% Cost Reduction vs On-Demand</text>
  </g>
</svg>
